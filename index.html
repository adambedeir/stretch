<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="description" content="Guided stretching routines for your split, your desk and your bedtime.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stretch">
<title>Stretch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <main id="view" class="view"></main>
</div>

<nav class="tabbar" aria-label="Sections">
  <div class="tabbar-in">
    <button data-act="tab" data-tab="today" class="on"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.8v1.9M12 19.3v1.9M5.5 5.5l1.3 1.3M17.2 17.2l1.3 1.3M2.8 12h1.9M19.3 12h1.9M5.5 18.5l1.3-1.3M17.2 6.8l1.3-1.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Today</span></button>
    <button data-act="tab" data-tab="body"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4.6" r="2.3" fill="currentColor"/><path d="M5 8.6c2.3.6 4.6.9 7 .9s4.7-.3 7-.9M12 9.5v5.2M12 14.7l-3 6.3M12 14.7l3 6.3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Body</span></button>
    <button data-act="tab" data-tab="library"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></g></svg><span>Library</span></button>
    <button data-act="tab" data-tab="progress"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V13M10 20V8M15 20v-5M20 20V5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span>Progress</span></button>
  </div>
</nav>

<div id="player" hidden></div>
<label id="haptic" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>

<script src="js/figure.js"></script>
<script src="js/stretches.js"></script>
<script src="js/bodymap.js"></script>
<script src="js/app.js"></script>
</body>
</html>
